<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 328" width="1160" height="328" role="img" aria-label="Kendall's tau between method rankings falls to 0.33 for the worst pair of baselines, mean 0.56. Grad-CAM ranks third under a zero baseline and second under blur and mean.">
  <style>
    .h1   { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:19px; font-weight:700; }
    .sub  { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:13px; }
    .pt   { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:14px; font-weight:650; }
    .pn   { font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size:10px; letter-spacing:0.4px; }
    .lbl  { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:12.5px; }
    .val  { font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size:12px; font-weight:650; }
    .ax   { font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size:9.5px; letter-spacing:0.3px; }
    .eyeb { font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size:10px; letter-spacing:2px; }
    .big  { font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size:30px; font-weight:700; }
    .note { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:12.5px; }
</style>
  <rect x="0.75" y="0.75" width="1158.5" height="326.5" rx="16" fill="#0d1117" stroke="#1f2733" stroke-width="1.5"/>
  <text x="40" y="42" class="eyeb" fill="#4a5765">EXPLAINABLE-VIT-CHEST-XRAY · BASELINE SENSITIVITY</text>
  <text x="40" y="72" class="h1" fill="#e9eff6">Change the perturbation baseline and the ranking changes with it</text>
  <text x="40" y="112" class="pt" fill="#e9eff6">Ranking agreement (Kendall’s τ)</text>
  <line x1="40" y1="186" x2="560" y2="186" stroke="#1c242e" stroke-width="10" stroke-linecap="round"/>
  <line x1="211.6" y1="171" x2="211.6" y2="201" stroke="#f7931e" stroke-width="2.5" stroke-linecap="round"/>
  <text x="211.6" y="162" class="val" text-anchor="middle" fill="#f7931e">0.33</text>
  <text x="211.6" y="144" class="pn" text-anchor="middle" fill="#8593a4">worst pair</text>
  <line x1="331.2" y1="171" x2="331.2" y2="201" stroke="#22b8cf" stroke-width="2.5" stroke-linecap="round"/>
  <text x="331.2" y="162" class="val" text-anchor="middle" fill="#22b8cf">0.56</text>
  <text x="331.2" y="144" class="pn" text-anchor="middle" fill="#8593a4">mean</text>
  <text x="40" y="220" class="ax" fill="#4a5765">0.0  no agreement</text>
  <text x="560" y="220" class="ax" text-anchor="end" fill="#4a5765">1.0  identical ranking</text>
  <text x="40" y="272" class="note" fill="#8593a4">τ = 1.0 would mean the choice of baseline does not matter. It does.</text>
  <text x="660" y="118" class="pt" fill="#e9eff6">Where Grad-CAM ranks, by baseline</text>
  <rect x="660" y="142" width="128" height="86" rx="12" fill="#1c242e" stroke="#f7931e" stroke-width="1.8"/>
  <text x="724.0" y="194" class="big" text-anchor="middle" fill="#f7931e">3rd</text>
  <text x="724.0" y="216" class="pn" text-anchor="middle" fill="#8593a4">of 3</text>
  <text x="724.0" y="252" class="lbl" text-anchor="middle" fill="#8593a4">zero baseline</text>
  <rect x="812" y="142" width="128" height="86" rx="12" fill="#1c242e" stroke="#1f2733" stroke-width="1"/>
  <text x="876.0" y="194" class="big" text-anchor="middle" fill="#e9eff6">2nd</text>
  <text x="876.0" y="216" class="pn" text-anchor="middle" fill="#8593a4">of 3</text>
  <text x="876.0" y="252" class="lbl" text-anchor="middle" fill="#8593a4">blur baseline</text>
  <rect x="964" y="142" width="128" height="86" rx="12" fill="#1c242e" stroke="#1f2733" stroke-width="1"/>
  <text x="1028.0" y="194" class="big" text-anchor="middle" fill="#e9eff6">2nd</text>
  <text x="1028.0" y="216" class="pn" text-anchor="middle" fill="#8593a4">of 3</text>
  <text x="1028.0" y="252" class="lbl" text-anchor="middle" fill="#8593a4">mean baseline</text>
  <text x="660" y="294" class="note" fill="#8593a4">Least faithful under a black baseline, second-most under blur and mean —</text>
  <text x="660" y="314" class="note" fill="#e9eff6">same method, same model, same images.</text>
</svg>
