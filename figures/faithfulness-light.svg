<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 468" width="1160" height="468" role="img" aria-label="Faithfulness of three attribution methods across four metrics. Attention-Rollout and Grad-CAM are near-tied; Integrated Gradients leads on insertion but trails badly on AOPC.">
