</style>
  <rect x="0.75" y="0.75" width="1158.5" height="466.5" rx="16" fill="#fbfcfd" stroke="#e4e9ef" stroke-width="1.5"/>
  <text x="40" y="42" class="eyeb" fill="#9aa5b1">EXPLAINABLE-VIT-CHEST-XRAY · FAITHFULNESS</text>
  <text x="40" y="72" class="h1" fill="#111820">Three attribution methods, four metrics — and almost nothing between them</text>
  <text x="40" y="94" class="sub" fill="#5b6875">Mean over 20 held-out test images, Gaussian-blur baseline. Axis ranges are zoomed and labelled; dots, not bars, so the zoom cannot exaggerate a difference.</text>
  <text x="40" y="132" class="pt" fill="#111820">Insertion AUC ↑</text>
  <text x="40" y="149" class="pn" fill="#9aa5b1">higher is better · confidence recovered as evidence is added back</text>
  <text x="40" y="182" class="lbl" fill="#5b6875">Attention-Rollout</text>
